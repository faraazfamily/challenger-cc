# Render's free plan puts the API to sleep after 15 minutes without traffic, and the next
# visitor waits ~10 seconds while it boots. Pinging it every 10 minutes keeps it awake.
# /api/health does not touch the database, so Neon can still sleep (and stay free).
# Set a repository variable API_URL (Settings -> Secrets and variables -> Actions -> Variables)
# if the API moves; otherwise the current Render address is used.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 "${API_URL}/api/health"
        env:
          API_URL: ${{ vars.API_URL || 'https://challenger-cc.onrender.com' }}
